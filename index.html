<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>각도 탐험대</title>
  <style>
    :root {
      --paper: #f4f7fb;
      --ink: #203047;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    }
    main {
      min-height: 100vh;
      background: var(--paper);
    }
  </style>
</head>
<body>
  <main aria-label="빈 페이지"></main>
</body>
</html>
